# VALORA - AI Economic Digital Twin Platform
# Docker Compose Configuration

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: valora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valora_secret}
      POSTGRES_DB: ${POSTGRES_DB:-valora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valora-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: valora-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-valora_redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valora-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valora-backend
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-valora}:${POSTGRES_PASSWORD:-valora_secret}@postgres:5432/${POSTGRES_DB:-valora}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-valora_redis}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,https://valora.example.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - valora-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valora-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-valora}:${POSTGRES_PASSWORD:-valora_secret}@postgres:5432/${POSTGRES_DB:-valora}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-valora_redis}@redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - valora-network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valora-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-valora}:${POSTGRES_PASSWORD:-valora_secret}@postgres:5432/${POSTGRES_DB:-valora}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-valora_redis}@redis:6379/0
    depends_on:
      - redis
      - celery-worker
    networks:
      - valora-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valora-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - valora-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: valora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - valora-network
    restart: unless-stopped

networks:
  valora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
